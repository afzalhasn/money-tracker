version: "3.9"

services:
  backend:
    build: ./backend
    container_name: moneytracker_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=development
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: moneytracker_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

  db:
    image: postgres:14
    container_name: moneytracker_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=moneytracker
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
